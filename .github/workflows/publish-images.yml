name: Publish immutable images

# checkov:skip=CKV_GHA_7:Strict inputs gate privileged work. [owner=modelguard-maintainers; expires=2026-10-31]
on:
  workflow_call:
    inputs:
      source_commit:
        description: Exact protected-main Git commit to build once
        required: true
        type: string
      governance_mode:
        description: Exact configured governance mode
        required: true
        type: string
      confirmation:
        description: Exact protected pipeline confirmation
        required: true
        type: string
      invocation_mode:
        description: Exact reusable caller contract
        required: true
        type: string
    outputs:
      api_ref:
        description: Immutable API repository digest
        value: ${{ jobs.publish.outputs.api_ref }}
      dashboard_ref:
        description: Immutable dashboard repository digest
        value: ${{ jobs.publish.outputs.dashboard_ref }}
      monitor_ref:
        description: Immutable monitor repository digest
        value: ${{ jobs.publish.outputs.monitor_ref }}
      manifest_sha256:
        description: Published image-manifest SHA-256
        value: ${{ jobs.publish.outputs.manifest_sha256 }}
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact 40-character commit at protected main HEAD
        required: true
        type: string
      governance_mode:
        description: Exact configured governance mode
        required: true
        type: choice
        options:
          - team_protected
          - solo_portfolio
      confirmation:
        description: Type PUBLISH modelguard-ai images
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: modelguard-image-publish
  cancel-in-progress: false

jobs:
  build-scan:
    name: Credentialless build and exact-digest image scans
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    outputs:
      transfer_manifest_sha256: ${{ steps.transfer.outputs.manifest_sha256 }}
      encrypted_transfer_sha256: ${{ steps.transfer.outputs.encrypted_sha256 }}
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      PROVENANCE_TAG: git-${{ inputs.source_commit }}
      GOVERNANCE_MODE: ${{ inputs.governance_mode }}
      CONFIGURED_GOVERNANCE_MODE: ${{ vars.DEPLOYMENT_GOVERNANCE_MODE }}
      REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
      INVOCATION_MODE: ${{ inputs.invocation_mode }}
      IMAGE_TRANSFER_PUBLIC_KEY_B64: ${{ vars.IMAGE_TRANSFER_PUBLIC_KEY_B64 }}
    steps:
      - name: Refuse an unreviewed source or confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$CONFIRMATION" = "PUBLISH modelguard-ai images"
          test "$SOURCE_COMMIT" = "$WORKFLOW_COMMIT"
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
      - name: Check out the exact source commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.12.1
          python-version: "3.12"
          enable-cache: true
      - name: Synchronize the locked environment
        run: uv sync --all-groups --locked
      - name: Verify the explicit image-publication governance entry
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          JOB_CONTEXT: ${{ toJSON(job) }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          job_workflow_ref="$(jq -er '.workflow_ref | select(type == "string" and length > 0)' <<<"$JOB_CONTEXT")"
          job_workflow_commit="$(jq -er '.workflow_sha | select(type == "string" and length > 0)' <<<"$JOB_CONTEXT")"
          test "$GOVERNANCE_MODE" = "$CONFIGURED_GOVERNANCE_MODE"
          entry_event="$GITHUB_EVENT_NAME"
          if [[ -n "$INVOCATION_MODE" ]]; then
            test "$INVOCATION_MODE" = "deploy_reusable"
            test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
            entry_event="workflow_call"
          fi
          uv run --frozen --no-sync python -m scripts.deployment_governance entry \
            --mode "$GOVERNANCE_MODE" \
            --operation publish \
            --repository "$GITHUB_REPOSITORY" \
            --repository-visibility "$REPOSITORY_VISIBILITY" \
            --event-name "$entry_event" \
            --git-ref "$GITHUB_REF" \
            --environment demo \
            --workflow-ref "$WORKFLOW_REF" \
            --job-workflow-ref "$job_workflow_ref" \
            --source-commit "$SOURCE_COMMIT" \
            --workflow-commit "$WORKFLOW_COMMIT" \
            --job-workflow-commit "$job_workflow_commit" \
            --confirmation "$CONFIRMATION"
      - name: Install only the checksum-verified Trivy binary
        run: uv run --frozen --no-sync python -m scripts.security_tools bootstrap --tool trivy
      - name: Refuse any release stage that bypasses a digest-pinned base
        run: >-
          uv run --frozen --no-sync python -m scripts.release_manifest verify-source
          --repository-root .
      - name: Build all three release images exactly once without cloud credentials
        run: |
          lock_sha="$(sha256sum uv.lock | awk '{print $1}')"
          mkdir -p artifacts/image-build
          for component in api dashboard monitor; do
            image_ref="modelguard-release-${component}:${PROVENANCE_TAG}"
            docker build --pull \
              --file "docker/${component}.Dockerfile" \
              --build-arg "SOURCE_REVISION=${SOURCE_COMMIT}" \
              --build-arg "UV_LOCK_SHA256=${lock_sha}" \
              --tag "$image_ref" .
            docker image inspect "$image_ref" | \
              jq '[.[] | {Id,RepoTags,RepoDigests,Config:{User:.Config.User,Labels:.Config.Labels}}]' \
                >"artifacts/image-build/inspect-${component}.json"
          done
      - name: Scan each exact content-addressed image and create CycloneDX evidence
        run: |
          for component in api dashboard monitor; do
            image_ref="modelguard-release-${component}:${PROVENANCE_TAG}"
            image_id="$(docker image inspect --format '{{.Id}}' "$image_ref")"
            ./scripts/security_scan.sh image \
              --image "$image_id" \
              --component "$component" \
              --output-dir artifacts/image-build
          done
      - name: Seal the scanned image transfer identity
        id: transfer
        run: |
          set +x
          test -n "$IMAGE_TRANSFER_PUBLIC_KEY_B64"
          docker save --output artifacts/image-build/images.tar \
            "modelguard-release-api:${PROVENANCE_TAG}" \
            "modelguard-release-dashboard:${PROVENANCE_TAG}" \
            "modelguard-release-monitor:${PROVENANCE_TAG}"
          archive_sha="$(sha256sum artifacts/image-build/images.tar | awk '{print $1}')"
          api_id="$(docker image inspect --format '{{.Id}}' "modelguard-release-api:${PROVENANCE_TAG}")"
          dashboard_id="$(docker image inspect --format '{{.Id}}' \
            "modelguard-release-dashboard:${PROVENANCE_TAG}")"
          monitor_id="$(docker image inspect --format '{{.Id}}' \
            "modelguard-release-monitor:${PROVENANCE_TAG}")"
          # security-suppression:
          # finding=SC2016
          # justification=The jq object uses only explicitly bound arguments.
          # owner=modelguard-maintainers
          # expires=2026-10-31
          # shellcheck disable=SC2016
          jq -n \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg archive_sha256 "$archive_sha" \
            --arg api_id "$api_id" \
            --arg dashboard_id "$dashboard_id" \
            --arg monitor_id "$monitor_id" \
            '{
              schema_version:"modelguard.image-build-transfer.v1",
              source_commit:$source_commit,
              archive_sha256:$archive_sha256,
              image_ids:{api:$api_id,dashboard:$dashboard_id,monitor:$monitor_id}
            }' >artifacts/image-build/build-transfer.json
          manifest_sha="$(sha256sum artifacts/image-build/build-transfer.json | awk '{print $1}')"
          tar --create --file artifacts/image-transfer.tar --directory artifacts/image-build .
          uv run --frozen --no-sync python -m scripts.confidential_artifact encrypt \
            --input artifacts/image-transfer.tar \
            --output artifacts/image-transfer.enc \
            --public-key-b64 "$IMAGE_TRANSFER_PUBLIC_KEY_B64"
          encrypted_sha="$(sha256sum artifacts/image-transfer.enc | awk '{print $1}')"
          rm -rf artifacts/image-build artifacts/image-transfer.tar
          echo "manifest_sha256=${manifest_sha}" >>"$GITHUB_OUTPUT"
          echo "encrypted_sha256=${encrypted_sha}" >>"$GITHUB_OUTPUT"
      - name: Upload only sanitized image SARIF to GitHub Code Scanning
        if: ${{ always() && hashFiles('artifacts/security/sarif/*.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          sarif_file: artifacts/security/sarif
          category: release-images-${{ inputs.source_commit }}
          wait-for-processing: true
      - name: Upload only the encrypted one-day same-run scanned image transfer
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-build-transfer-${{ inputs.source_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/image-transfer.enc
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Protected digest-preserving ECR publication
    needs: build-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: demo
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      api_ref: ${{ steps.manifest.outputs.api_ref }}
      dashboard_ref: ${{ steps.manifest.outputs.dashboard_ref }}
      monitor_ref: ${{ steps.manifest.outputs.monitor_ref }}
      manifest_sha256: ${{ steps.manifest.outputs.manifest_sha256 }}
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      PROVENANCE_TAG: git-${{ inputs.source_commit }}
      TRANSFER_MANIFEST_SHA256: ${{ needs.build-scan.outputs.transfer_manifest_sha256 }}
      ENCRYPTED_TRANSFER_SHA256: ${{ needs.build-scan.outputs.encrypted_transfer_sha256 }}
    steps:
      - name: Refuse an unreviewed source, confirmation, account, or Region
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$CONFIRMATION" = "PUBLISH modelguard-ai images"
          test "$SOURCE_COMMIT" = "$WORKFLOW_COMMIT"
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          [[ "$AWS_REGION" =~ ^[a-z]{2}(-[a-z]+)+-[0-9]+$ ]]
          [[ "$TRANSFER_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ENCRYPTED_TRANSFER_SHA256" =~ ^[0-9a-f]{64}$ ]]
      - name: Check out the exact source commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Download only this run's scanned image transfer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: >-
            image-build-transfer-${{ inputs.source_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/encrypted-image-release
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.12.1
          python-version: "3.12"
          enable-cache: true
      - name: Synchronize the locked environment
        run: uv sync --all-groups --locked
      - name: Decrypt only the exact same-run scanned image transfer on the ephemeral runner
        env:
          IMAGE_TRANSFER_PRIVATE_KEY_B64: ${{ secrets.IMAGE_TRANSFER_PRIVATE_KEY_B64 }}
        run: |
          set +x
          encrypted=artifacts/encrypted-image-release/image-transfer.enc
          test "$(sha256sum "$encrypted" | awk '{print $1}')" = \
            "$ENCRYPTED_TRANSFER_SHA256"
          transfer_private_key="${IMAGE_TRANSFER_PRIVATE_KEY_B64:-}"
          unset IMAGE_TRANSFER_PRIVATE_KEY_B64
          test -n "$transfer_private_key"
          printf '%s' "$transfer_private_key" | \
            uv run --frozen --no-sync python -m scripts.confidential_artifact decrypt \
              --input "$encrypted" \
              --output artifacts/image-release.tar \
              --private-key-stdin
          transfer_private_key=
          rm -f "$encrypted"
          install -d -m 0700 artifacts/image-release
          tar --extract --file artifacts/image-release.tar --directory artifacts/image-release
          rm -f artifacts/image-release.tar
      - name: Verify and load only the exact scanned image transfer
        run: |
          transfer=artifacts/image-release/build-transfer.json
          test "$(sha256sum "$transfer" | awk '{print $1}')" = "$TRANSFER_MANIFEST_SHA256"
          test "$(jq -r .schema_version "$transfer")" = "modelguard.image-build-transfer.v1"
          test "$(jq -r .source_commit "$transfer")" = "$SOURCE_COMMIT"
          test "$(sha256sum artifacts/image-release/images.tar | awk '{print $1}')" = \
            "$(jq -r .archive_sha256 "$transfer")"
          docker load --input artifacts/image-release/images.tar >/dev/null
          for component in api dashboard monitor; do
            image_ref="modelguard-release-${component}:${PROVENANCE_TAG}"
            actual_id="$(docker image inspect --format '{{.Id}}' "$image_ref")"
            expected_id="$(jq -r --arg component "$component" \
              '.image_ids[$component]' "$transfer")"
            test "$actual_id" = "$expected_id"
            test "$(jq -r '.[0].Id' "artifacts/image-release/inspect-${component}.json")" = \
              "$expected_id"
          done
          rm -f artifacts/image-release/images.tar artifacts/image-release/build-transfer.json
      - name: Assume the protected-environment deploy role through OIDC
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: modelguard-publish-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
      - name: Verify the exact image-publication OIDC identity
        run: >-
          uv run --frozen --no-sync python -m scripts.human_aws_login verify-workflow
          --region "$AWS_REGION"
          --expected-account-id "$AWS_ACCOUNT_ID"
          --expected-role-arn "$AWS_DEPLOY_ROLE_ARN"
          --role-kind deploy
          >/dev/null
      - name: Verify account, repositories, and create-only tags
        run: |
          for component in api dashboard monitor; do
            repository="modelguard-ai/demo/${component}"
            aws ecr describe-repositories --repository-names "$repository" >/dev/null
            if aws ecr describe-images --repository-name "$repository" \
              --image-ids "imageTag=${PROVENANCE_TAG}" >/dev/null 2>&1; then
              echo "Refusing to overwrite an existing immutable provenance tag."
              exit 1
            fi
          done
      - name: Authenticate to ECR only after the image transfer is verified
        run: |
          registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
      - name: Tag and push each already-scanned image without rebuilding
        run: |
          registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          for component in api dashboard monitor; do
            local_ref="modelguard-release-${component}:${PROVENANCE_TAG}"
            remote_ref="${registry}/modelguard-ai/demo/${component}:${PROVENANCE_TAG}"
            docker tag "$local_ref" "$remote_ref"
            docker push "$remote_ref"
            docker image inspect "$remote_ref" | \
              jq '[.[] | {Id,RepoTags,RepoDigests,Config:{User:.Config.User,Labels:.Config.Labels}}]' \
                >"artifacts/image-release/inspect-${component}.json"
            aws ecr describe-images \
              --repository-name "modelguard-ai/demo/${component}" \
              --image-ids "imageTag=${PROVENANCE_TAG}" \
              >"artifacts/image-release/ecr-${component}.json"
          done
      - name: Bind ECR digests, source labels, SBOMs, and Dockerfiles
        id: manifest
        run: |
          uv run --frozen --no-sync python -m scripts.release_manifest create \
            --repository-root . \
            --evidence-dir artifacts/image-release \
            --account-id "$AWS_ACCOUNT_ID" \
            --region "$AWS_REGION" \
            --source-commit "$SOURCE_COMMIT" \
            --output artifacts/image-release/image-release-manifest.json \
            --github-output "$GITHUB_OUTPUT"
          rm -f artifacts/image-release/inspect-*.json artifacts/image-release/ecr-*.json
      - name: Store the solo release manifest in the encrypted private audit bucket
        if: ${{ inputs.governance_mode == 'solo_portfolio' }}
        run: |
          audit_bucket="modelguard-ai-demo-${AWS_ACCOUNT_ID}-${AWS_REGION}-audit"
          aws s3api put-object \
            --bucket "$audit_bucket" \
            --key "release-manifests/${SOURCE_COMMIT}.json" \
            --body artifacts/image-release/image-release-manifest.json \
            --expected-bucket-owner "$AWS_ACCOUNT_ID" >/dev/null
      - name: Upload immutable release and scan evidence
        if: ${{ success() && inputs.governance_mode == 'team_protected' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: >-
            published-image-manifest-${{ inputs.source_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/image-release/
          if-no-files-found: error
          retention-days: 30
      - name: End the ECR registry session
        if: ${{ always() }}
        run: docker logout "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com" || true
