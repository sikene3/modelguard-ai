name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  UV_NO_SYNC: "1"
  MLFLOW_DISABLE_TELEMETRY: "true"

jobs:
  quality:
    name: Format, lint, and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.12.1
          python-version: "3.12"
          enable-cache: true
      - name: Synchronize the locked environment
        run: uv sync --all-groups --locked
        env:
          UV_NO_SYNC: "0"
      - name: Check Ruff formatting
        run: uv run ruff format --check .
      - name: Run Ruff lint
        run: uv run ruff check .
      - name: Run strict Mypy
        run: make typecheck

  tests:
    name: Pytest and branch coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.12.1
          python-version: "3.12"
          enable-cache: true
      - name: Synchronize the locked environment
        run: uv sync --all-groups --locked
        env:
          UV_NO_SYNC: "0"
      - name: Run tests with portable reports
        run: |
          mkdir -p artifacts/ci
          uv run pytest -q \
            --junitxml=artifacts/ci/pytest.xml \
            --cov-report=xml:artifacts/ci/coverage.xml \
            --cov-report=term-missing:skip-covered
      - name: Upload test and coverage evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-tests-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/ci/pytest.xml
            artifacts/ci/coverage.xml
          if-no-files-found: error
          retention-days: 14

  security:
    name: Reproducible security release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.12.1
          python-version: "3.12"
          enable-cache: true
      - name: Synchronize the locked environment
        run: uv sync --all-groups --locked
        env:
          UV_NO_SYNC: "0"
      - name: Run Bandit, hashed dependency audit, and basic repository defense
        run: make security
      - name: Install the checksum and digest verified local scanner toolchain
        run: make security-tools-bootstrap
      - name: Run the shared fail-closed repository scanner policy
        run: make security-scan
      - name: Upload only sanitized scanner SARIF to GitHub Code Scanning
        if: ${{ always() && hashFiles('artifacts/security/sarif/*.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          sarif_file: artifacts/security/sarif
          category: repository-security-${{ github.sha }}
          wait-for-processing: true

  workflow-lint:
    name: Workflow YAML compatibility lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.12.1
          python-version: "3.12"
          enable-cache: true
      - name: Synchronize the locked lint environment
        run: uv sync --all-groups --locked
        env:
          UV_NO_SYNC: "0"
      - name: Run locked yamllint
        run: uv run --frozen --no-sync yamllint .github/workflows
