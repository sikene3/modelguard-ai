name: Container security

on:
  pull_request:
    paths:
      - "docker/**"
      - "src/**"
      - ".streamlit/**"
      - "pyproject.toml"
      - "uv.lock"
      - "security/**"
      - "scripts/security_*.py"
      - "scripts/security_scan.sh"
      - "scripts/sanitize_sarif.py"
      - ".github/workflows/container-security.yml"
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "src/**"
      - ".streamlit/**"
      - "pyproject.toml"
      - "uv.lock"
      - "security/**"
      - "scripts/security_*.py"
      - "scripts/security_scan.sh"
      - "scripts/sanitize_sarif.py"
      - ".github/workflows/container-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-scan:
    name: Build and scan ${{ matrix.component }} once
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        component: [api, dashboard, monitor]
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.12.1
          python-version: "3.12"
          enable-cache: true
      - name: Synchronize the locked environment
        run: uv sync --all-groups --locked
      - name: Install only the checksum-verified Trivy binary
        run: uv run --frozen --no-sync python -m scripts.security_tools bootstrap --tool trivy
      - name: Build the digest-based release Dockerfile once
        env:
          COMPONENT: ${{ matrix.component }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          lock_sha="$(sha256sum uv.lock | awk '{print $1}')"
          docker build --pull \
            --file "docker/${COMPONENT}.Dockerfile" \
            --build-arg "SOURCE_REVISION=${SOURCE_COMMIT}" \
            --build-arg "UV_LOCK_SHA256=${lock_sha}" \
            --tag "modelguard-${COMPONENT}:scan-${SOURCE_COMMIT}" .
          mkdir -p "artifacts/container-security/${COMPONENT}"
          docker image inspect "modelguard-${COMPONENT}:scan-${SOURCE_COMMIT}" | \
            jq '[.[] | {Id,RepoTags,RepoDigests,Config:{User:.Config.User,Labels:.Config.Labels}}]' \
              >"artifacts/container-security/${COMPONENT}/image-inspect.json"
      - name: Scan the exact content-addressed image and generate CycloneDX evidence
        env:
          COMPONENT: ${{ matrix.component }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          image_id="$(docker image inspect \
            --format '{{.Id}}' "modelguard-${COMPONENT}:scan-${SOURCE_COMMIT}")"
          ./scripts/security_scan.sh image \
            --image "$image_id" \
            --component "$COMPONENT" \
            --output-dir "artifacts/container-security/${COMPONENT}"
      - name: Upload only sanitized image SARIF to GitHub Code Scanning
        if: ${{ always() && hashFiles('artifacts/security/sarif/*.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          sarif_file: artifacts/security/sarif
          category: trivy-image-${{ matrix.component }}-${{ github.sha }}
          wait-for-processing: true
      - name: Upload image metadata, SBOM, and vulnerability evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: >-
            container-security-${{ matrix.component }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/container-security/${{ matrix.component }}/
          if-no-files-found: error
          retention-days: 14
