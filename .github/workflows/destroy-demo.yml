name: Destroy protected demo

# checkov:skip=CKV_GHA_7:Exact destructive inputs and two protected environment gates are mandatory. [owner=modelguard-maintainers; expires=2026-10-31]
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact 40-character protected-main commit
        required: true
        type: string
      governance_mode:
        description: Exact configured governance mode
        required: true
        type: choice
        options:
          - team_protected
          - solo_portfolio
      auto_destroy_date:
        description: Exact AutoDestroyDate from the deployed state
        required: true
        type: string
      teardown_authorized:
        description: Explicit one-run authorization for dormant destroy inputs
        required: true
        default: false
        type: boolean
      confirmation:
        description: Exact governance-mode destroy phrase
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: modelguard-demo-deploy
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  destroy-plan:
    name: Create confidential destroy plan and redacted review evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: demo-destroy
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
      BACKEND_KMS_KEY_ARN: ${{ vars.TF_BACKEND_KMS_KEY_ARN }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      PERMISSION_BOUNDARY_ARN: ${{ vars.TF_PERMISSION_BOUNDARY_ARN }}
      ALERT_KMS_KEY_ARN: ${{ vars.TF_ALERT_KMS_KEY_ARN }}
      OWNER_TAG: ${{ vars.DEMO_OWNER_TAG }}
      ALB_ALLOWED_CIDR: ${{ vars.DEMO_ALB_ALLOWED_CIDR }}
      API_ACCESS_MODE: ${{ vars.DEMO_API_ACCESS_MODE }}
      ACM_CERTIFICATE_ARN: ${{ vars.DEMO_ACM_CERTIFICATE_ARN }}
      PREDICTION_TOKEN_SSM_ARN: ${{ vars.DEMO_PREDICTION_TOKEN_SSM_ARN }}
      GOVERNANCE_MODE: ${{ inputs.governance_mode }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      AUTO_DESTROY_DATE: ${{ inputs.auto_destroy_date }}
      TEARDOWN_AUTHORIZED: ${{ inputs.teardown_authorized }}
      CONFIGURED_GOVERNANCE_MODE: ${{ vars.DEPLOYMENT_GOVERNANCE_MODE }}
      REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
    steps:
      - name: Check out the exact protected-main source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Install pinned Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.12.1
          python-version: "3.12"
          enable-cache: true
      - name: Synchronize the locked environment
        run: uv sync --all-groups --locked
      - name: Verify exact destroy entry identity and typed confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          JOB_CONTEXT: ${{ toJSON(job) }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          job_workflow_ref="$(jq -er '.workflow_ref | select(type == "string" and length > 0)' <<<"$JOB_CONTEXT")"
          job_workflow_commit="$(jq -er '.workflow_sha | select(type == "string" and length > 0)' <<<"$JOB_CONTEXT")"
          test "$GOVERNANCE_MODE" = "$CONFIGURED_GOVERNANCE_MODE"
          test "$TEARDOWN_AUTHORIZED" = "true"
          uv run --frozen --no-sync python -m scripts.deployment_governance entry \
            --mode "$GOVERNANCE_MODE" \
            --operation destroy \
            --repository "$GITHUB_REPOSITORY" \
            --repository-visibility "$REPOSITORY_VISIBILITY" \
            --event-name "$GITHUB_EVENT_NAME" \
            --git-ref "$GITHUB_REF" \
            --environment demo-destroy \
            --workflow-ref "$WORKFLOW_REF" \
            --job-workflow-ref "$job_workflow_ref" \
            --source-commit "$SOURCE_COMMIT" \
            --workflow-commit "$GITHUB_SHA" \
            --job-workflow-commit "$job_workflow_commit" \
            --confirmation "$CONFIRMATION"
      - name: Assume the exact destroy environment role through OIDC
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: modelguard-destroy-plan-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
      - name: Verify the exact destroy-plan OIDC identity
        run: >-
          uv run --frozen --no-sync python -m scripts.human_aws_login verify-workflow
          --region "$AWS_REGION"
          --expected-account-id "$AWS_ACCOUNT_ID"
          --expected-role-arn "$AWS_DEPLOY_ROLE_ARN"
          --role-kind deploy
          >/dev/null
      - name: Render exact destroy inputs and initialize retained backend
        run: |
          uv run --frozen --no-sync python -m scripts.render_ci_terraform \
            --output-dir artifacts/destroy \
            --stage destroy \
            --teardown-authorized \
            --account-id "$AWS_ACCOUNT_ID" \
            --region "$AWS_REGION" \
            --owner-tag "$OWNER_TAG" \
            --governance-mode "$GOVERNANCE_MODE" \
            --auto-destroy-date "$AUTO_DESTROY_DATE" \
            --backend-bucket "$BACKEND_BUCKET" \
            --backend-kms-key-arn "$BACKEND_KMS_KEY_ARN" \
            --permission-boundary-arn "$PERMISSION_BOUNDARY_ARN" \
            --alert-kms-key-arn "$ALERT_KMS_KEY_ARN" \
            --alb-allowed-cidr "$ALB_ALLOWED_CIDR" \
            --access-mode "$API_ACCESS_MODE" \
            --acm-certificate-arn "$ACM_CERTIFICATE_ARN" \
            --prediction-token-ssm-arn "$PREDICTION_TOKEN_SSM_ARN"
          uv run --frozen --no-sync python scripts/terraform_demo_guard.py preflight \
            --input artifacts/destroy/preflight.json \
            --account-id "$AWS_ACCOUNT_ID" \
            --region "$AWS_REGION" \
            --stage destroy \
            --backend-bucket "$BACKEND_BUCKET"
          rm -f artifacts/destroy/preflight.json
          terraform -chdir=infrastructure/environments/demo init -input=false -reconfigure \
            -lockfile=readonly -backend-config="$GITHUB_WORKSPACE/artifacts/destroy/backend.hcl"
          test "$(terraform -chdir=infrastructure/environments/demo workspace show)" = "default"
      - name: Create, seal, and summarize the exact destroy plan
        run: |
          umask 077
          terraform -chdir=infrastructure/environments/demo plan -destroy -input=false \
            -lock-timeout=5m -no-color \
            -var-file="$GITHUB_WORKSPACE/artifacts/destroy/demo-ci.tfvars.json" \
            -out="$GITHUB_WORKSPACE/artifacts/destroy/destroy.tfplan" >/dev/null 2>&1
          source_activation_state="$(
            terraform -chdir=infrastructure/environments/demo show -json \
              "$GITHUB_WORKSPACE/artifacts/destroy/destroy.tfplan" 2>/dev/null | \
              uv run --frozen --no-sync python scripts/terraform_demo_guard.py \
                classify-destroy-plan-source-state 2>/dev/null
          )"
          uv run --frozen --no-sync python scripts/terraform_demo_guard.py seal-plan \
            --plan artifacts/destroy/destroy.tfplan \
            --var-file artifacts/destroy/demo-ci.tfvars.json \
            --backend-config artifacts/destroy/backend.hcl \
            --stage destroy \
            --account-id "$AWS_ACCOUNT_ID" \
            --region "$AWS_REGION" \
            --repository . \
            --auto-destroy-date "$AUTO_DESTROY_DATE" \
            --activate-services false \
            --source-activation-state "$source_activation_state" \
            --output artifacts/destroy/destroy.tfplan.identity.json
          terraform -chdir=infrastructure/environments/demo show -json \
            "$GITHUB_WORKSPACE/artifacts/destroy/destroy.tfplan" 2>/dev/null | \
            uv run --frozen --no-sync python -m scripts.plan_evidence \
              --plan artifacts/destroy/destroy.tfplan \
              --manifest artifacts/destroy/destroy.tfplan.identity.json \
              --output-json artifacts/destroy/destroy.redacted.json \
              --output-markdown artifacts/destroy/destroy.redacted.md \
              --repository "$GITHUB_REPOSITORY" \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --workflow-ref "$GITHUB_WORKFLOW_REF"
          cat artifacts/destroy/destroy.redacted.md >>"$GITHUB_STEP_SUMMARY"
      - name: Transfer raw destroy inputs only through encrypted private S3
        env:
          PLAN_STAGE: destroy
          TRANSFER_DIRECTORY: artifacts/destroy
        run: ./scripts/confidential_plan_transfer.sh upload
      - name: Upload only redacted destroy evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: destroy-plan-redacted-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/destroy/destroy.redacted.json
            artifacts/destroy/destroy.redacted.md
          if-no-files-found: error
          retention-days: 30

  destroy-apply:
    name: Apply only the explicitly reviewed destroy plan
    needs: destroy-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: demo-destroy
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
      BACKEND_KMS_KEY_ARN: ${{ vars.TF_BACKEND_KMS_KEY_ARN }}
      GOVERNANCE_MODE: ${{ inputs.governance_mode }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      TEARDOWN_AUTHORIZED: ${{ inputs.teardown_authorized }}
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Install pinned Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.12.1
          python-version: "3.12"
      - name: Synchronize the locked environment
        run: uv sync --all-groups --locked
      - name: Assume the exact destroy environment role through OIDC
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: modelguard-destroy-apply-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
      - name: Verify the exact destroy-apply OIDC identity
        env:
          EXPECTED_AWS_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: >-
          uv run --frozen --no-sync python -m scripts.human_aws_login verify-workflow
          --region "$AWS_REGION"
          --expected-account-id "$AWS_ACCOUNT_ID"
          --expected-role-arn "$EXPECTED_AWS_ROLE_ARN"
          --role-kind deploy
          >/dev/null
      - name: Create the private destroy-transfer parent
        run: |
          test ! -e artifacts/destroy
          test ! -L artifacts/destroy
          mkdir -m 0700 artifacts/destroy
      - name: Retrieve only this run's encrypted private destroy transfer
        env:
          PLAN_STAGE: destroy
          TRANSFER_DIRECTORY: artifacts/destroy/destroy-transfer
        run: ./scripts/confidential_plan_transfer.sh download
      - name: Reverify the explicit one-run teardown authorization
        run: test "$TEARDOWN_AUTHORIZED" = "true"
      - name: Verify the exact human-reviewed destroy evidence
        env:
          REVIEWED_PLAN_SHA256: ${{ vars.REVIEWED_DESTROY_PLAN_SHA256 }}
          REVIEWED_PLAN_IDENTITY_SHA256: ${{ vars.REVIEWED_DESTROY_IDENTITY_SHA256 }}
          REVIEWED_RUN_IDENTITY: ${{ vars.REVIEWED_DESTROY_RUN_IDENTITY }}
          REVIEW_CONFIRMATION: ${{ vars.REVIEWED_DESTROY_CONFIRMATION }}
        run: |
          plan=artifacts/destroy/destroy-transfer/destroy.tfplan
          identity=artifacts/destroy/destroy-transfer/destroy.tfplan.identity.json
          uv run --frozen --no-sync python -m scripts.deployment_governance evidence \
            --mode "$GOVERNANCE_MODE" \
            --stage destroy \
            --run-identity "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:destroy" \
            --reviewed-run-identity "$REVIEWED_RUN_IDENTITY" \
            --confirmation "$REVIEW_CONFIRMATION" \
            --source-commit "$SOURCE_COMMIT" \
            --workflow-commit "$GITHUB_SHA" \
            --plan-sha256 "$(sha256sum "$plan" | awk '{print $1}')" \
            --reviewed-plan-sha256 "$REVIEWED_PLAN_SHA256" \
            --plan-identity-sha256 "$(sha256sum "$identity" | awk '{print $1}')" \
            --reviewed-plan-identity-sha256 "$REVIEWED_PLAN_IDENTITY_SHA256"
      - name: Reverify and apply the exact destroy plan
        env:
          GITHUB_ACTIONS: "true"
          MODELGUARD_GITHUB_ENVIRONMENT: demo-destroy
          CONFIRM_APPLY: "YES"
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          EXPECTED_AWS_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          BACKEND_BUCKET_NAME: ${{ vars.TF_BACKEND_BUCKET }}
          BACKEND_CONFIG: ${{ github.workspace }}/artifacts/destroy/destroy-transfer/backend.hcl
          TFVARS_FILE: ${{ github.workspace }}/artifacts/destroy/destroy-transfer/demo-ci.tfvars.json
          PLAN_STAGE: destroy
          DEPLOYMENT_GOVERNANCE_MODE: ${{ inputs.governance_mode }}
          PLAN_FILE: ${{ github.workspace }}/artifacts/destroy/destroy-transfer/destroy.tfplan
          PLAN_MANIFEST: >-
            ${{ github.workspace }}/artifacts/destroy/destroy-transfer/destroy.tfplan.identity.json
        run: ./scripts/ci_apply_saved_plan.sh
      - name: Verify twice and privately retain the exact teardown inventories
        env:
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          EXPECTED_AWS_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          evidence_prefix="phase-10-evidence/teardown/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
          preserve_inventory() {
            local label="$1"
            local path="$2"
            local local_sha256
            local put_checksum
            local readback_checksum
            if [[ ! -f "$path" || -L "$path" || ! -O "$path" \
              || "$(stat -c '%a' -- "$path" 2>/dev/null || true)" != "600" ]]; then
              echo "Refusing teardown evidence retention: private inventory receipt is invalid." >&2
              return 1
            fi
            local_sha256="$(sha256sum "$path" | awk '{print $1}')"
            if ! put_checksum="$(aws s3api put-object \
              --bucket "$BACKEND_BUCKET" \
              --key "${evidence_prefix}/${label}.json" \
              --body "$path" \
              --content-type application/json \
              --server-side-encryption aws:kms \
              --ssekms-key-id "$BACKEND_KMS_KEY_ARN" \
              --checksum-algorithm SHA256 \
              --if-none-match '*' \
              --expected-bucket-owner "$AWS_ACCOUNT_ID" \
              --query ChecksumSHA256 --output text 2>/dev/null)"; then
              echo "Refusing teardown evidence retention: encrypted create-only upload failed." >&2
              return 1
            fi
            if [[ -z "$put_checksum" || "$put_checksum" == "None" ]]; then
              echo "Refusing teardown evidence retention: upload checksum is missing." >&2
              return 1
            fi
            if ! readback_checksum="$(aws s3api head-object \
              --bucket "$BACKEND_BUCKET" \
              --key "${evidence_prefix}/${label}.json" \
              --checksum-mode ENABLED \
              --expected-bucket-owner "$AWS_ACCOUNT_ID" \
              --query ChecksumSHA256 --output text 2>/dev/null)"; then
              echo "Refusing teardown evidence retention: checksum readback failed." >&2
              return 1
            fi
            if [[ "$readback_checksum" != "$put_checksum" ]]; then
              echo "Refusing teardown evidence retention: checksum readback mismatch." >&2
              return 1
            fi
            if [[ "$label" == "initial" ]]; then
              initial_sha256="$local_sha256"
            else
              confirmation_sha256="$local_sha256"
            fi
          }

          initial_sha256=""
          confirmation_sha256=""
          initial_path=artifacts/destroy/post-destroy-inventory-initial.json
          initial_status=0
          INVENTORY_OUTPUT="$initial_path" ./scripts/verify_aws_teardown.sh || initial_status=$?
          if [[ ! -f "$initial_path" ]]; then
            echo "Initial teardown inventory failed before producing a private receipt." >&2
            if (( initial_status == 0 )); then exit 1; else exit "$initial_status"; fi
          fi
          preserve_inventory initial "$initial_path"

          sleep 30

          confirmation_path=artifacts/destroy/post-destroy-inventory-confirmation.json
          confirmation_status=0
          INVENTORY_OUTPUT="$confirmation_path" ./scripts/verify_aws_teardown.sh \
            || confirmation_status=$?
          if [[ ! -f "$confirmation_path" ]]; then
            echo "Confirmation teardown inventory failed before producing a private receipt." >&2
            if (( confirmation_status == 0 )); then exit 1; else exit "$confirmation_status"; fi
          fi
          preserve_inventory confirmation "$confirmation_path"
          if (( confirmation_status != 0 )); then
            echo "Confirmation teardown inventory found a residual or invalid contract." >&2
            exit "$confirmation_status"
          fi
          {
            echo "### Teardown inventory"
            echo "- Initial create-only encrypted receipt retained (status: ${initial_status}; SHA-256: ${initial_sha256})."
            echo "- Delayed confirmation create-only encrypted receipt retained and passed (SHA-256: ${confirmation_sha256})."
          } >>"$GITHUB_STEP_SUMMARY"
          if ! rm -f -- "$initial_path" "$confirmation_path"; then
            echo "Private teardown inventory cleanup failed." >&2
            exit 1
          fi
      - name: Delete the exact confidential destroy transfer after evidence retention
        env:
          EXPECTED_AWS_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          PLAN_STAGE: destroy
          TRANSFER_DIRECTORY: artifacts/destroy/destroy-transfer
        run: |
          uv run --frozen --no-sync python -m scripts.human_aws_login verify-workflow \
            --region "$AWS_REGION" \
            --expected-account-id "$AWS_ACCOUNT_ID" \
            --expected-role-arn "$EXPECTED_AWS_ROLE_ARN" \
            --role-kind deploy >/dev/null
          ./scripts/confidential_plan_transfer.sh delete
