name: Deploy protected demo

# checkov:skip=CKV_GHA_7:Strict inputs gate privileged work. [owner=modelguard-maintainers; expires=2026-10-31]
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact 40-character commit at protected main HEAD
        required: true
        type: string
      governance_mode:
        description: Exact configured governance mode
        required: true
        type: choice
        options:
          - team_protected
          - solo_portfolio
      model_version:
        description: Promoted semantic model version
        required: true
        type: string
      model_manifest_sha256:
        description: Promoted model manifest SHA-256
        required: true
        type: string
      auto_destroy_date:
        description: UTC YYYY-MM-DD, no more than 14 days away
        required: true
        type: string
      confirmation:
        description: Type DEPLOY modelguard-ai demo
        required: true
        type: string
      api_image_ref:
        description: Solo mode exact previously published API repository digest
        required: false
        type: string
      dashboard_image_ref:
        description: Solo mode exact previously published dashboard repository digest
        required: false
        type: string
      monitor_image_ref:
        description: Solo mode exact previously published monitor repository digest
        required: false
        type: string
      image_manifest_sha256:
        description: Solo mode exact confidential release-manifest SHA-256
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: modelguard-demo-deploy
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  prerequisite-plan:
    name: Protected runtime-disabled prerequisite plan
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: demo
    permissions:
      contents: read
      id-token: write
    outputs:
      plan_sha256: ${{ steps.plan_identity.outputs.plan_sha256 }}
      plan_identity_sha256: ${{ steps.plan_identity.outputs.plan_identity_sha256 }}
      run_identity: ${{ steps.plan_identity.outputs.run_identity }}
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
      BACKEND_KMS_KEY_ARN: ${{ vars.TF_BACKEND_KMS_KEY_ARN }}
      PERMISSION_BOUNDARY_ARN: ${{ vars.TF_PERMISSION_BOUNDARY_ARN }}
      ALERT_KMS_KEY_ARN: ${{ vars.TF_ALERT_KMS_KEY_ARN }}
      OWNER_TAG: ${{ vars.DEMO_OWNER_TAG }}
      ALB_ALLOWED_CIDR: ${{ vars.DEMO_ALB_ALLOWED_CIDR }}
      API_ACCESS_MODE: ${{ vars.DEMO_API_ACCESS_MODE }}
      ACM_CERTIFICATE_ARN: ${{ vars.DEMO_ACM_CERTIFICATE_ARN }}
      PREDICTION_TOKEN_SSM_ARN: ${{ vars.DEMO_PREDICTION_TOKEN_SSM_ARN }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      AUTO_DESTROY_DATE: ${{ inputs.auto_destroy_date }}
      EXPECTED_MODEL_VERSION: ${{ inputs.model_version }}
      EXPECTED_MODEL_MANIFEST_SHA256: ${{ inputs.model_manifest_sha256 }}
      REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
      REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
      GOVERNANCE_MODE: ${{ inputs.governance_mode }}
      CONFIGURED_GOVERNANCE_MODE: ${{ vars.DEPLOYMENT_GOVERNANCE_MODE }}
    steps:
      - name: Refuse a non-main source or inexact dispatch confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GOVERNANCE_MODE" = "$CONFIGURED_GOVERNANCE_MODE"
          if [[ "$GOVERNANCE_MODE" = "team_protected" ]]; then
            test "$REPOSITORY_IS_PRIVATE" = "true"
          else
            test "$GOVERNANCE_MODE" = "solo_portfolio"
            test "$REPOSITORY_IS_PRIVATE" = "false"
          fi
          test "$CONFIRMATION" = "DEPLOY modelguard-ai demo"
          test "$SOURCE_COMMIT" = "$WORKFLOW_COMMIT"
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_MODEL_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_MODEL_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
      - name: Check out the exact protected-main source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Install pinned Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.12.1
          python-version: "3.12"
          enable-cache: true
      - name: Synchronize the locked environment
        run: uv sync --all-groups --locked
      - name: Verify the explicit deployment-governance entry contract
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          JOB_CONTEXT: ${{ toJSON(job) }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          job_workflow_ref="$(jq -er '.workflow_ref | select(type == "string" and length > 0)' <<<"$JOB_CONTEXT")"
          job_workflow_commit="$(jq -er '.workflow_sha | select(type == "string" and length > 0)' <<<"$JOB_CONTEXT")"
          uv run --frozen --no-sync python -m scripts.deployment_governance entry \
            --mode "$GOVERNANCE_MODE" \
            --operation deploy \
            --repository "$GITHUB_REPOSITORY" \
            --repository-visibility "$REPOSITORY_VISIBILITY" \
            --event-name "$GITHUB_EVENT_NAME" \
            --git-ref "$GITHUB_REF" \
            --environment demo \
            --workflow-ref "$WORKFLOW_REF" \
            --job-workflow-ref "$job_workflow_ref" \
            --source-commit "$SOURCE_COMMIT" \
            --workflow-commit "$WORKFLOW_COMMIT" \
            --job-workflow-commit "$job_workflow_commit" \
            --confirmation "$CONFIRMATION"
      - name: Assume the protected-environment deploy role through OIDC
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: modelguard-prereq-plan-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
      - name: Verify account and render guarded prerequisite inputs
        run: |
          actual_account="$(aws sts get-caller-identity --query Account --output text)"
          test "$actual_account" = "$AWS_ACCOUNT_ID"
          uv run --frozen --no-sync python -m scripts.aws_readiness_preflight all \
            --region "$AWS_REGION" \
            --workflow-role-arn "$AWS_DEPLOY_ROLE_ARN"
          uv run --frozen --no-sync python -m scripts.render_ci_terraform \
            --output-dir artifacts/deploy/prerequisite \
            --stage prerequisites \
            --account-id "$AWS_ACCOUNT_ID" \
            --region "$AWS_REGION" \
            --owner-tag "$OWNER_TAG" \
            --governance-mode "$GOVERNANCE_MODE" \
            --auto-destroy-date "$AUTO_DESTROY_DATE" \
            --backend-bucket "$BACKEND_BUCKET" \
            --backend-kms-key-arn "$BACKEND_KMS_KEY_ARN" \
            --permission-boundary-arn "$PERMISSION_BOUNDARY_ARN" \
            --alert-kms-key-arn "$ALERT_KMS_KEY_ARN" \
            --alb-allowed-cidr "$ALB_ALLOWED_CIDR" \
            --access-mode "$API_ACCESS_MODE" \
            --acm-certificate-arn "$ACM_CERTIFICATE_ARN" \
            --prediction-token-ssm-arn "$PREDICTION_TOKEN_SSM_ARN"
          uv run --frozen --no-sync python scripts/terraform_demo_guard.py preflight \
            --input artifacts/deploy/prerequisite/preflight.json \
            --account-id "$AWS_ACCOUNT_ID" \
            --region "$AWS_REGION" \
            --stage prerequisites \
            --backend-bucket "$BACKEND_BUCKET"
          rm -f artifacts/deploy/prerequisite/preflight.json
      - name: Create and seal the runtime-disabled saved plan
        run: |
          terraform -chdir=infrastructure/environments/demo init -input=false -reconfigure \
            -lockfile=readonly \
            -backend-config="$GITHUB_WORKSPACE/artifacts/deploy/prerequisite/backend.hcl"
          test "$(terraform -chdir=infrastructure/environments/demo workspace show)" = "default"
          if ! terraform -chdir=infrastructure/environments/demo plan -input=false -lock-timeout=5m \
            -var-file="$GITHUB_WORKSPACE/artifacts/deploy/prerequisite/demo-ci.tfvars.json" \
            -out="$GITHUB_WORKSPACE/artifacts/deploy/prerequisite/prerequisites.tfplan" \
            -no-color >/dev/null 2>&1; then
            echo "Terraform prerequisite plan failed; raw output was suppressed." >&2
            exit 1
          fi
          uv run --frozen --no-sync python scripts/terraform_demo_guard.py seal-plan \
            --plan artifacts/deploy/prerequisite/prerequisites.tfplan \
            --var-file artifacts/deploy/prerequisite/demo-ci.tfvars.json \
            --backend-config artifacts/deploy/prerequisite/backend.hcl \
            --stage prerequisites \
            --account-id "$AWS_ACCOUNT_ID" \
            --region "$AWS_REGION" \
            --repository . \
            --auto-destroy-date "$AUTO_DESTROY_DATE" \
            --activate-services false \
            --output artifacts/deploy/prerequisite/prerequisites.tfplan.identity.json
      - name: Render a value-free prerequisite review summary
        run: |
          terraform -chdir=infrastructure/environments/demo show -json \
            "$GITHUB_WORKSPACE/artifacts/deploy/prerequisite/prerequisites.tfplan" 2>/dev/null | \
            uv run --frozen --no-sync python -m scripts.plan_evidence \
              --manifest artifacts/deploy/prerequisite/prerequisites.tfplan.identity.json \
              --output-json artifacts/deploy/prerequisite/prerequisites.redacted.json \
              --output-markdown artifacts/deploy/prerequisite/prerequisites.redacted.md \
              --repository "$GITHUB_REPOSITORY" \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --workflow-ref "$GITHUB_WORKFLOW_REF"
          cat artifacts/deploy/prerequisite/prerequisites.redacted.md >>"$GITHUB_STEP_SUMMARY"
      - name: Seal the exact prerequisite review identity
        id: plan_identity
        run: |
          {
            echo "plan_sha256=$(sha256sum artifacts/deploy/prerequisite/prerequisites.tfplan | awk '{print $1}')"
            echo "plan_identity_sha256=$(sha256sum artifacts/deploy/prerequisite/prerequisites.tfplan.identity.json | awk '{print $1}')"
            echo "run_identity=${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:prerequisites"
          } >>"$GITHUB_OUTPUT"
      - name: Transfer raw prerequisite inputs only through encrypted private S3
        env:
          PLAN_STAGE: prerequisites
          TRANSFER_DIRECTORY: artifacts/deploy/prerequisite
        run: ./scripts/confidential_plan_transfer.sh upload
      - name: Upload durable redacted prerequisite evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prerequisite-plan-redacted-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/deploy/prerequisite/prerequisites.redacted.json
            artifacts/deploy/prerequisite/prerequisites.redacted.md
          if-no-files-found: error
          retention-days: 30

  prerequisite-apply:
    name: Protected reviewed prerequisite apply
    needs: prerequisite-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: demo
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Install pinned Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.12.1
          python-version: "3.12"
      - name: Synchronize the locked environment
        run: uv sync --all-groups --locked
      - name: Assume the protected-environment deploy role through OIDC
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: modelguard-prereq-apply-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
      - name: Download only this run's encrypted private prerequisite transfer
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          BACKEND_KMS_KEY_ARN: ${{ vars.TF_BACKEND_KMS_KEY_ARN }}
          PLAN_STAGE: prerequisites
          TRANSFER_DIRECTORY: artifacts/deploy/prerequisite-transfer
        run: ./scripts/confidential_plan_transfer.sh download
      - name: Verify the human-reviewed prerequisite evidence boundary
        env:
          GOVERNANCE_MODE: ${{ inputs.governance_mode }}
          REVIEWED_PLAN_SHA256: ${{ vars.REVIEWED_PREREQUISITE_PLAN_SHA256 }}
          REVIEWED_PLAN_IDENTITY_SHA256: ${{ vars.REVIEWED_PREREQUISITE_IDENTITY_SHA256 }}
          REVIEWED_RUN_IDENTITY: ${{ vars.REVIEWED_PREREQUISITE_RUN_IDENTITY }}
          REVIEW_CONFIRMATION: ${{ vars.REVIEWED_PREREQUISITE_CONFIRMATION }}
        run: |
          plan=artifacts/deploy/prerequisite-transfer/prerequisites.tfplan
          identity=artifacts/deploy/prerequisite-transfer/prerequisites.tfplan.identity.json
          uv run --frozen --no-sync python -m scripts.deployment_governance evidence \
            --mode "$GOVERNANCE_MODE" \
            --stage prerequisites \
            --run-identity "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:prerequisites" \
            --reviewed-run-identity "$REVIEWED_RUN_IDENTITY" \
            --confirmation "$REVIEW_CONFIRMATION" \
            --source-commit "${{ inputs.source_commit }}" \
            --workflow-commit "$GITHUB_SHA" \
            --plan-sha256 "$(sha256sum "$plan" | awk '{print $1}')" \
            --reviewed-plan-sha256 "$REVIEWED_PLAN_SHA256" \
            --plan-identity-sha256 "$(sha256sum "$identity" | awk '{print $1}')" \
            --reviewed-plan-identity-sha256 "$REVIEWED_PLAN_IDENTITY_SHA256"
      - name: Reverify and apply the exact same saved plan
        env:
          GITHUB_ACTIONS: "true"
          MODELGUARD_GITHUB_ENVIRONMENT: demo
          CONFIRM_APPLY: "YES"
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          BACKEND_BUCKET_NAME: ${{ vars.TF_BACKEND_BUCKET }}
          BACKEND_CONFIG: ${{ github.workspace }}/artifacts/deploy/prerequisite-transfer/backend.hcl
          TFVARS_FILE: ${{ github.workspace }}/artifacts/deploy/prerequisite-transfer/demo-ci.tfvars.json
          PLAN_STAGE: prerequisites
          DEPLOYMENT_GOVERNANCE_MODE: ${{ inputs.governance_mode }}
          PLAN_FILE: ${{ github.workspace }}/artifacts/deploy/prerequisite-transfer/prerequisites.tfplan
          PLAN_MANIFEST: >-
            ${{ github.workspace }}/artifacts/deploy/prerequisite-transfer/prerequisites.tfplan.identity.json
        run: ./scripts/ci_apply_saved_plan.sh
      - name: Preserve only the sealed prerequisite identity in the encrypted audit bucket
        run: |
          audit_bucket="modelguard-ai-demo-${AWS_ACCOUNT_ID}-${AWS_REGION}-audit"
          aws s3api put-object \
            --bucket "$audit_bucket" \
            --key "deployments/plan-identities/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/prerequisites.json" \
            --body artifacts/deploy/prerequisite-transfer/prerequisites.tfplan.identity.json \
            --expected-bucket-owner "$AWS_ACCOUNT_ID" >/dev/null
      - name: Delete the exact private prerequisite transfer after successful apply
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          BACKEND_KMS_KEY_ARN: ${{ vars.TF_BACKEND_KMS_KEY_ARN }}
          PLAN_STAGE: prerequisites
          TRANSFER_DIRECTORY: artifacts/deploy/prerequisite-transfer
        run: ./scripts/confidential_plan_transfer.sh delete

  notification-enrollment-gate:
    name: Require value-free drift notification enrollment evidence
    needs: prerequisite-apply
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: demo
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.12.1
          python-version: "3.12"
          enable-cache: true
      - name: Synchronize the locked environment
        run: uv sync --all-groups --locked
      - name: Assume the exact protected deploy identity through OIDC
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: modelguard-notification-gate-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
      - name: Refuse activation until manual drift notification enrollment is present
        run: >-
          uv run --frozen --no-sync python -m scripts.notification_enrollment verify
          --account-id "$AWS_ACCOUNT_ID"
          --region "$AWS_REGION"
          --workflow-role-arn "$AWS_DEPLOY_ROLE_ARN"

  publish-images:
    name: Build, scan, and publish once after prerequisites
    needs: notification-enrollment-gate
    if: ${{ inputs.governance_mode == 'team_protected' }}
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    uses: ./.github/workflows/publish-images.yml
    with:
      source_commit: ${{ inputs.source_commit }}
      governance_mode: ${{ inputs.governance_mode }}
      confirmation: PUBLISH modelguard-ai images
      invocation_mode: deploy_reusable

  resolve-images:
    name: Resolve team publication or prior manual solo publication
    needs: [notification-enrollment-gate, publish-images]
    if: >-
      always() &&
      needs.notification-enrollment-gate.result == 'success' &&
      (needs.publish-images.result == 'success' || needs.publish-images.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      api_ref: ${{ steps.resolve.outputs.api_ref }}
      dashboard_ref: ${{ steps.resolve.outputs.dashboard_ref }}
      monitor_ref: ${{ steps.resolve.outputs.monitor_ref }}
      manifest_sha256: ${{ steps.resolve.outputs.manifest_sha256 }}
    env:
      GOVERNANCE_MODE: ${{ inputs.governance_mode }}
      PUBLISHED_API_REF: ${{ needs.publish-images.outputs.api_ref }}
      PUBLISHED_DASHBOARD_REF: ${{ needs.publish-images.outputs.dashboard_ref }}
      PUBLISHED_MONITOR_REF: ${{ needs.publish-images.outputs.monitor_ref }}
      PUBLISHED_MANIFEST_SHA256: ${{ needs.publish-images.outputs.manifest_sha256 }}
      SOLO_API_REF: ${{ inputs.api_image_ref }}
      SOLO_DASHBOARD_REF: ${{ inputs.dashboard_image_ref }}
      SOLO_MONITOR_REF: ${{ inputs.monitor_image_ref }}
      SOLO_MANIFEST_SHA256: ${{ inputs.image_manifest_sha256 }}
    steps:
      - name: Select only the exact governance-mode image identity
        id: resolve
        run: |
          if [[ "$GOVERNANCE_MODE" = "team_protected" ]]; then
            test -z "$SOLO_API_REF$SOLO_DASHBOARD_REF$SOLO_MONITOR_REF$SOLO_MANIFEST_SHA256"
            api_ref="$PUBLISHED_API_REF"
            dashboard_ref="$PUBLISHED_DASHBOARD_REF"
            monitor_ref="$PUBLISHED_MONITOR_REF"
            manifest_sha="$PUBLISHED_MANIFEST_SHA256"
          else
            test "$GOVERNANCE_MODE" = "solo_portfolio"
            api_ref="$SOLO_API_REF"
            dashboard_ref="$SOLO_DASHBOARD_REF"
            monitor_ref="$SOLO_MONITOR_REF"
            manifest_sha="$SOLO_MANIFEST_SHA256"
          fi
          [[ "$api_ref" =~ /api@sha256:[0-9a-f]{64}$ ]]
          [[ "$dashboard_ref" =~ /dashboard@sha256:[0-9a-f]{64}$ ]]
          [[ "$monitor_ref" =~ /monitor@sha256:[0-9a-f]{64}$ ]]
          [[ "$manifest_sha" =~ ^[0-9a-f]{64}$ ]]
          {
            echo "api_ref=$api_ref"
            echo "dashboard_ref=$dashboard_ref"
            echo "monitor_ref=$monitor_ref"
            echo "manifest_sha256=$manifest_sha"
          } >>"$GITHUB_OUTPUT"

  verify-inputs:
    name: Verify immutable images, model, pointer, token metadata, and runtime contract
    needs: resolve-images
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: demo
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      API_ACCESS_MODE: ${{ vars.DEMO_API_ACCESS_MODE }}
      ACM_CERTIFICATE_ARN: ${{ vars.DEMO_ACM_CERTIFICATE_ARN }}
      PREDICTION_TOKEN_SSM_ARN: ${{ vars.DEMO_PREDICTION_TOKEN_SSM_ARN }}
      SMOKE_BASE_URL: ${{ vars.DEMO_SMOKE_BASE_URL }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      EXPECTED_MODEL_VERSION: ${{ inputs.model_version }}
      EXPECTED_MODEL_MANIFEST_SHA256: ${{ inputs.model_manifest_sha256 }}
      API_IMAGE_REF: ${{ needs.resolve-images.outputs.api_ref }}
      DASHBOARD_IMAGE_REF: ${{ needs.resolve-images.outputs.dashboard_ref }}
      MONITOR_IMAGE_REF: ${{ needs.resolve-images.outputs.monitor_ref }}
      GOVERNANCE_MODE: ${{ inputs.governance_mode }}
      IMAGE_MANIFEST_SHA256: ${{ needs.resolve-images.outputs.manifest_sha256 }}
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Download this run's published release evidence
        if: ${{ inputs.governance_mode == 'team_protected' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: >-
            published-image-manifest-${{ inputs.source_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/deploy/published
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.12.1
          python-version: "3.12"
          enable-cache: true
      - name: Synchronize the locked environment
        run: uv sync --all-groups --locked
      - name: Verify the release manifest and digest outputs before cloud access
        if: ${{ inputs.governance_mode == 'team_protected' }}
        run: |
          manifest=artifacts/deploy/published/image-release-manifest.json
          actual_manifest_sha="$(sha256sum "$manifest" | awk '{print $1}')"
          test "$actual_manifest_sha" = "$IMAGE_MANIFEST_SHA256"
          uv run --frozen --no-sync python -m scripts.release_manifest verify \
            --manifest "$manifest" \
            --account-id "$AWS_ACCOUNT_ID" \
            --region "$AWS_REGION" \
            --source-commit "$SOURCE_COMMIT"
          test "$(jq -r .images.api.image_ref "$manifest")" = "$API_IMAGE_REF"
          test "$(jq -r .images.dashboard.image_ref "$manifest")" = "$DASHBOARD_IMAGE_REF"
          test "$(jq -r .images.monitor.image_ref "$manifest")" = "$MONITOR_IMAGE_REF"
      - name: Assume the protected-environment deploy role through OIDC
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: modelguard-verify-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
      - name: Retrieve the solo release manifest only from encrypted private storage
        if: ${{ inputs.governance_mode == 'solo_portfolio' }}
        run: |
          mkdir -p artifacts/deploy/published
          audit_bucket="modelguard-ai-demo-${AWS_ACCOUNT_ID}-${AWS_REGION}-audit"
          aws s3api get-object \
            --bucket "$audit_bucket" \
            --key "release-manifests/${SOURCE_COMMIT}.json" \
            --expected-bucket-owner "$AWS_ACCOUNT_ID" \
            artifacts/deploy/published/image-release-manifest.json >/dev/null
      - name: Reverify the exact release manifest after identity selection
        run: |
          manifest=artifacts/deploy/published/image-release-manifest.json
          actual_manifest_sha="$(sha256sum "$manifest" | awk '{print $1}')"
          test "$actual_manifest_sha" = "$IMAGE_MANIFEST_SHA256"
          uv run --frozen --no-sync python -m scripts.release_manifest verify \
            --manifest "$manifest" \
            --account-id "$AWS_ACCOUNT_ID" \
            --region "$AWS_REGION" \
            --source-commit "$SOURCE_COMMIT"
          test "$(jq -r .images.api.image_ref "$manifest")" = "$API_IMAGE_REF"
          test "$(jq -r .images.dashboard.image_ref "$manifest")" = "$DASHBOARD_IMAGE_REF"
          test "$(jq -r .images.monitor.image_ref "$manifest")" = "$MONITOR_IMAGE_REF"
      - name: Authenticate Docker for exact ECR digest verification
        run: |
          registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
      - name: Re-resolve ECR tags and pull only exact published digests
        run: |
          mkdir -p artifacts/deploy/verified/live-images
          for component in api dashboard monitor; do
            aws ecr describe-images \
              --repository-name "modelguard-ai/demo/${component}" \
              --image-ids "imageTag=git-${SOURCE_COMMIT}" \
              >"artifacts/deploy/verified/live-images/ecr-${component}.json"
          done
          for image_ref in "$API_IMAGE_REF" "$DASHBOARD_IMAGE_REF" "$MONITOR_IMAGE_REF"; do
            docker pull "$image_ref"
          done
          docker image inspect "$API_IMAGE_REF" | \
            jq '[.[] | {Id,RepoTags,RepoDigests,Config:{User:.Config.User,Labels:.Config.Labels}}]' \
              >artifacts/deploy/verified/live-images/inspect-api.json
          docker image inspect "$DASHBOARD_IMAGE_REF" | \
            jq '[.[] | {Id,RepoTags,RepoDigests,Config:{User:.Config.User,Labels:.Config.Labels}}]' \
              >artifacts/deploy/verified/live-images/inspect-dashboard.json
          docker image inspect "$MONITOR_IMAGE_REF" | \
            jq '[.[] | {Id,RepoTags,RepoDigests,Config:{User:.Config.User,Labels:.Config.Labels}}]' \
              >artifacts/deploy/verified/live-images/inspect-monitor.json
          uv run --frozen --no-sync python -m scripts.release_manifest verify-live \
            --manifest artifacts/deploy/published/image-release-manifest.json \
            --evidence-dir artifacts/deploy/verified/live-images \
            --account-id "$AWS_ACCOUNT_ID" \
            --region "$AWS_REGION" \
            --source-commit "$SOURCE_COMMIT"
      - name: Capture active pointer and metadata without fetching the token value
        run: |
          mkdir -p artifacts/deploy/verified
          aws ssm get-parameter \
            --name /modelguard-ai/demo/models/active \
            >artifacts/deploy/verified/pointer-response.json
          if [[ "$API_ACCESS_MODE" == "https_token" ]]; then
            token_name="${PREDICTION_TOKEN_SSM_ARN#*:parameter}"
            aws ssm describe-parameters \
              --parameter-filters "Key=Name,Option=Equals,Values=${token_name}" \
              >artifacts/deploy/verified/token-metadata.json
            aws acm describe-certificate \
              --certificate-arn "$ACM_CERTIFICATE_ARN" \
              >artifacts/deploy/verified/certificate-metadata.json
          fi
      - name: Verify pointer, model identity, token type, and certificate hostname
        run: |
          verify_args=(
            --pointer-response artifacts/deploy/verified/pointer-response.json
            --account-id "$AWS_ACCOUNT_ID"
            --region "$AWS_REGION"
            --model-version "$EXPECTED_MODEL_VERSION"
            --manifest-sha256 "$EXPECTED_MODEL_MANIFEST_SHA256"
            --access-mode "$API_ACCESS_MODE"
            --smoke-base-url "$SMOKE_BASE_URL"
            --output-pointer artifacts/deploy/verified/active-pointer.json
            --output-summary artifacts/deploy/verified/verified-inputs.json
            --output-objects artifacts/deploy/verified/model-objects.json
          )
          if [[ "$API_ACCESS_MODE" == "https_token" ]]; then
            verify_args+=(
              --token-metadata artifacts/deploy/verified/token-metadata.json
              --token-parameter-arn "$PREDICTION_TOKEN_SSM_ARN"
              --certificate-metadata artifacts/deploy/verified/certificate-metadata.json
              --certificate-arn "$ACM_CERTIFICATE_ARN"
            )
          fi
          uv run --frozen --no-sync python -m scripts.verify_deployment_inputs "${verify_args[@]}"
          rm -f artifacts/deploy/verified/pointer-response.json
          rm -f artifacts/deploy/verified/token-metadata.json
          rm -f artifacts/deploy/verified/certificate-metadata.json
      - name: Download and structurally verify every exact model object version
        run: |
          mkdir -p artifacts/deploy/verified/model-bundle
          while IFS= read -r object; do
            bucket="$(jq -r .bucket <<<"$object")"
            key="$(jq -r .key <<<"$object")"
            version_id="$(jq -r .version_id <<<"$object")"
            filename="${key##*/}"
            aws s3api get-object \
              --bucket "$bucket" \
              --key "$key" \
              --version-id "$version_id" \
              "artifacts/deploy/verified/model-bundle/${filename}" >/dev/null
          done < <(jq -c '.[]' artifacts/deploy/verified/model-objects.json)
          actual_manifest="$(sha256sum artifacts/deploy/verified/model-bundle/manifest.json | awk '{print $1}')"
          test "$actual_manifest" = "$EXPECTED_MODEL_MANIFEST_SHA256"
          uv run --frozen --no-sync python -m modelguard.training.cli inspect \
            --bundle artifacts/deploy/verified/model-bundle
      - name: Prove digest-pinned runtime interfaces before activation
        env:
          RUNTIME_VERIFICATION_OUTPUT: artifacts/deploy/verified/runtime-contract.json
        run: ./scripts/verify_release_runtime.sh
      - name: Store solo activation inputs only in encrypted private storage
        if: ${{ inputs.governance_mode == 'solo_portfolio' }}
        run: |
          audit_bucket="modelguard-ai-demo-${AWS_ACCOUNT_ID}-${AWS_REGION}-audit"
          prefix="deployments/activation-inputs/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
          for name in active-pointer.json verified-inputs.json model-objects.json runtime-contract.json; do
            aws s3api put-object \
              --bucket "$audit_bucket" \
              --key "${prefix}/${name}" \
              --body "artifacts/deploy/verified/${name}" \
              --expected-bucket-owner "$AWS_ACCOUNT_ID" >/dev/null
          done
      - name: Upload one-day verified activation inputs
        if: ${{ success() && inputs.governance_mode == 'team_protected' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-activation-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/deploy/verified/active-pointer.json
            artifacts/deploy/verified/verified-inputs.json
            artifacts/deploy/verified/model-objects.json
            artifacts/deploy/verified/runtime-contract.json
          if-no-files-found: error
          retention-days: 1
      - name: Upload non-secret verification evidence on success or refusal
        if: ${{ always() && inputs.governance_mode == 'team_protected' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-input-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/deploy/verified/verified-inputs.json
            artifacts/deploy/verified/live-images/
          if-no-files-found: warn
          retention-days: 30
      - name: End the ECR verification session
        if: ${{ always() }}
        run: docker logout "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com" || true

  activation-plan:
    name: Protected digest-only activation plan
    needs: [resolve-images, verify-inputs]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: demo
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      plan_sha256: ${{ steps.plan_identity.outputs.plan_sha256 }}
      plan_identity_sha256: ${{ steps.plan_identity.outputs.plan_identity_sha256 }}
      model_pointer_sha256: ${{ steps.plan_identity.outputs.model_pointer_sha256 }}
      run_identity: ${{ steps.plan_identity.outputs.run_identity }}
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
      BACKEND_KMS_KEY_ARN: ${{ vars.TF_BACKEND_KMS_KEY_ARN }}
      PERMISSION_BOUNDARY_ARN: ${{ vars.TF_PERMISSION_BOUNDARY_ARN }}
      ALERT_KMS_KEY_ARN: ${{ vars.TF_ALERT_KMS_KEY_ARN }}
      OWNER_TAG: ${{ vars.DEMO_OWNER_TAG }}
      ALB_ALLOWED_CIDR: ${{ vars.DEMO_ALB_ALLOWED_CIDR }}
      API_ACCESS_MODE: ${{ vars.DEMO_API_ACCESS_MODE }}
      ACM_CERTIFICATE_ARN: ${{ vars.DEMO_ACM_CERTIFICATE_ARN }}
      PREDICTION_TOKEN_SSM_ARN: ${{ vars.DEMO_PREDICTION_TOKEN_SSM_ARN }}
      AUTO_DESTROY_DATE: ${{ inputs.auto_destroy_date }}
      API_IMAGE_REF: ${{ needs.resolve-images.outputs.api_ref }}
      DASHBOARD_IMAGE_REF: ${{ needs.resolve-images.outputs.dashboard_ref }}
      MONITOR_IMAGE_REF: ${{ needs.resolve-images.outputs.monitor_ref }}
      GOVERNANCE_MODE: ${{ inputs.governance_mode }}
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Download only this run's verified pointer input
        if: ${{ inputs.governance_mode == 'team_protected' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-activation-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/deploy/verified-transfer
      - name: Install pinned Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.12.1
          python-version: "3.12"
          enable-cache: true
      - name: Synchronize the locked environment
        run: uv sync --all-groups --locked
      - name: Assume the protected-environment deploy role through OIDC
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: modelguard-activation-plan-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
      - name: Retrieve solo activation inputs only from encrypted private storage
        if: ${{ inputs.governance_mode == 'solo_portfolio' }}
        run: |
          mkdir -p artifacts/deploy/verified-transfer
          audit_bucket="modelguard-ai-demo-${AWS_ACCOUNT_ID}-${AWS_REGION}-audit"
          prefix="deployments/activation-inputs/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
          for name in active-pointer.json verified-inputs.json model-objects.json runtime-contract.json; do
            aws s3api get-object \
              --bucket "$audit_bucket" \
              --key "${prefix}/${name}" \
              --expected-bucket-owner "$AWS_ACCOUNT_ID" \
              "artifacts/deploy/verified-transfer/${name}" >/dev/null
          done
      - name: Render and preflight digest-only activation inputs
        run: |
          actual_account="$(aws sts get-caller-identity --query Account --output text)"
          test "$actual_account" = "$AWS_ACCOUNT_ID"
          uv run --frozen --no-sync python -m scripts.aws_readiness_preflight all \
            --region "$AWS_REGION" \
            --workflow-role-arn "$AWS_DEPLOY_ROLE_ARN"
          uv run --frozen --no-sync python -m scripts.render_ci_terraform \
            --output-dir artifacts/deploy/activation \
            --stage activation \
            --account-id "$AWS_ACCOUNT_ID" \
            --region "$AWS_REGION" \
            --owner-tag "$OWNER_TAG" \
            --governance-mode "$GOVERNANCE_MODE" \
            --auto-destroy-date "$AUTO_DESTROY_DATE" \
            --backend-bucket "$BACKEND_BUCKET" \
            --backend-kms-key-arn "$BACKEND_KMS_KEY_ARN" \
            --permission-boundary-arn "$PERMISSION_BOUNDARY_ARN" \
            --alert-kms-key-arn "$ALERT_KMS_KEY_ARN" \
            --alb-allowed-cidr "$ALB_ALLOWED_CIDR" \
            --access-mode "$API_ACCESS_MODE" \
            --acm-certificate-arn "$ACM_CERTIFICATE_ARN" \
            --prediction-token-ssm-arn "$PREDICTION_TOKEN_SSM_ARN" \
            --api-image-ref "$API_IMAGE_REF" \
            --dashboard-image-ref "$DASHBOARD_IMAGE_REF" \
            --monitor-image-ref "$MONITOR_IMAGE_REF" \
            --budget-prerequisite-verified \
            --runtime-verification-file \
              artifacts/deploy/verified-transfer/runtime-contract.json \
            --source-commit "$SOURCE_COMMIT" \
            --active-pointer-file artifacts/deploy/verified-transfer/active-pointer.json
          uv run --frozen --no-sync python scripts/terraform_demo_guard.py preflight \
            --input artifacts/deploy/activation/preflight.json \
            --account-id "$AWS_ACCOUNT_ID" \
            --region "$AWS_REGION" \
            --stage activation \
            --backend-bucket "$BACKEND_BUCKET"
          rm -f artifacts/deploy/activation/preflight.json
          install -m 0600 artifacts/deploy/verified-transfer/active-pointer.json \
            artifacts/deploy/activation/active-pointer.json
      - name: Create and seal the digest-only activation saved plan
        run: |
          terraform -chdir=infrastructure/environments/demo init -input=false -reconfigure \
            -lockfile=readonly \
            -backend-config="$GITHUB_WORKSPACE/artifacts/deploy/activation/backend.hcl"
          test "$(terraform -chdir=infrastructure/environments/demo workspace show)" = "default"
          test "$(terraform -chdir=infrastructure/environments/demo output -raw deployment_governance_mode)" = \
            "$GOVERNANCE_MODE"
          if ! terraform -chdir=infrastructure/environments/demo plan -input=false -lock-timeout=5m \
            -var-file="$GITHUB_WORKSPACE/artifacts/deploy/activation/demo-ci.tfvars.json" \
            -out="$GITHUB_WORKSPACE/artifacts/deploy/activation/activation.tfplan" \
            -no-color >/dev/null 2>&1; then
            echo "Terraform activation plan failed; raw output was suppressed." >&2
            exit 1
          fi
          uv run --frozen --no-sync python scripts/terraform_demo_guard.py seal-plan \
            --plan artifacts/deploy/activation/activation.tfplan \
            --var-file artifacts/deploy/activation/demo-ci.tfvars.json \
            --backend-config artifacts/deploy/activation/backend.hcl \
            --stage activation \
            --account-id "$AWS_ACCOUNT_ID" \
            --region "$AWS_REGION" \
            --repository . \
            --auto-destroy-date "$AUTO_DESTROY_DATE" \
            --activate-services true \
            --output artifacts/deploy/activation/activation.tfplan.identity.json
      - name: Render a value-free activation review summary
        run: |
          terraform -chdir=infrastructure/environments/demo show -json \
            "$GITHUB_WORKSPACE/artifacts/deploy/activation/activation.tfplan" 2>/dev/null | \
            uv run --frozen --no-sync python -m scripts.plan_evidence \
              --manifest artifacts/deploy/activation/activation.tfplan.identity.json \
              --output-json artifacts/deploy/activation/activation.redacted.json \
              --output-markdown artifacts/deploy/activation/activation.redacted.md \
              --repository "$GITHUB_REPOSITORY" \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --workflow-ref "$GITHUB_WORKFLOW_REF"
          cat artifacts/deploy/activation/activation.redacted.md >>"$GITHUB_STEP_SUMMARY"
      - name: Seal the exact activation review identity
        id: plan_identity
        run: |
          {
            echo "plan_sha256=$(sha256sum artifacts/deploy/activation/activation.tfplan | awk '{print $1}')"
            echo "plan_identity_sha256=$(sha256sum artifacts/deploy/activation/activation.tfplan.identity.json | awk '{print $1}')"
            echo "model_pointer_sha256=$(sha256sum artifacts/deploy/activation/active-pointer.json | awk '{print $1}')"
            echo "run_identity=${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:activation"
          } >>"$GITHUB_OUTPUT"
      - name: Transfer raw activation inputs only through encrypted private S3
        env:
          PLAN_STAGE: activation
          TRANSFER_DIRECTORY: artifacts/deploy/activation
        run: ./scripts/confidential_plan_transfer.sh upload
      - name: Upload durable redacted activation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: activation-plan-redacted-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/deploy/activation/activation.redacted.json
            artifacts/deploy/activation/activation.redacted.md
          if-no-files-found: error
          retention-days: 30

  activation-apply:
    name: Protected reviewed activation apply
    needs: [activation-plan, resolve-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: demo
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Install pinned Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.12.1
          python-version: "3.12"
      - name: Synchronize the locked environment
        run: uv sync --all-groups --locked
      - name: Assume the protected-environment deploy role through OIDC
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: modelguard-activation-apply-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
      - name: Download only this run's encrypted private activation transfer
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
          BACKEND_KMS_KEY_ARN: ${{ vars.TF_BACKEND_KMS_KEY_ARN }}
          PLAN_STAGE: activation
          TRANSFER_DIRECTORY: artifacts/deploy/activation-transfer
        run: ./scripts/confidential_plan_transfer.sh download
      - name: Verify the human-reviewed activation evidence boundary
        env:
          GOVERNANCE_MODE: ${{ inputs.governance_mode }}
          API_IMAGE_REF: ${{ needs.resolve-images.outputs.api_ref }}
          DASHBOARD_IMAGE_REF: ${{ needs.resolve-images.outputs.dashboard_ref }}
          MONITOR_IMAGE_REF: ${{ needs.resolve-images.outputs.monitor_ref }}
          REVIEWED_API_IMAGE_REF: ${{ vars.REVIEWED_API_IMAGE_REF }}
          REVIEWED_DASHBOARD_IMAGE_REF: ${{ vars.REVIEWED_DASHBOARD_IMAGE_REF }}
          REVIEWED_MONITOR_IMAGE_REF: ${{ vars.REVIEWED_MONITOR_IMAGE_REF }}
          REVIEWED_PLAN_SHA256: ${{ vars.REVIEWED_ACTIVATION_PLAN_SHA256 }}
          REVIEWED_PLAN_IDENTITY_SHA256: ${{ vars.REVIEWED_ACTIVATION_IDENTITY_SHA256 }}
          REVIEWED_MODEL_POINTER_SHA256: ${{ vars.REVIEWED_ACTIVATION_MODEL_POINTER_SHA256 }}
          REVIEWED_RUN_IDENTITY: ${{ vars.REVIEWED_ACTIVATION_RUN_IDENTITY }}
          REVIEW_CONFIRMATION: ${{ vars.REVIEWED_ACTIVATION_CONFIRMATION }}
        run: |
          plan=artifacts/deploy/activation-transfer/activation.tfplan
          identity=artifacts/deploy/activation-transfer/activation.tfplan.identity.json
          pointer=artifacts/deploy/activation-transfer/active-pointer.json
          uv run --frozen --no-sync python -m scripts.deployment_governance evidence \
            --mode "$GOVERNANCE_MODE" \
            --stage activation \
            --run-identity "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:activation" \
            --reviewed-run-identity "$REVIEWED_RUN_IDENTITY" \
            --confirmation "$REVIEW_CONFIRMATION" \
            --source-commit "${{ inputs.source_commit }}" \
            --workflow-commit "$GITHUB_SHA" \
            --api-image-ref "$API_IMAGE_REF" \
            --dashboard-image-ref "$DASHBOARD_IMAGE_REF" \
            --monitor-image-ref "$MONITOR_IMAGE_REF" \
            --reviewed-api-image-ref "$REVIEWED_API_IMAGE_REF" \
            --reviewed-dashboard-image-ref "$REVIEWED_DASHBOARD_IMAGE_REF" \
            --reviewed-monitor-image-ref "$REVIEWED_MONITOR_IMAGE_REF" \
            --model-pointer-sha256 "$(sha256sum "$pointer" | awk '{print $1}')" \
            --reviewed-model-pointer-sha256 "$REVIEWED_MODEL_POINTER_SHA256" \
            --plan-sha256 "$(sha256sum "$plan" | awk '{print $1}')" \
            --reviewed-plan-sha256 "$REVIEWED_PLAN_SHA256" \
            --plan-identity-sha256 "$(sha256sum "$identity" | awk '{print $1}')" \
            --reviewed-plan-identity-sha256 "$REVIEWED_PLAN_IDENTITY_SHA256"
      - name: Reverify and apply the exact same activation plan
        env:
          GITHUB_ACTIONS: "true"
          MODELGUARD_GITHUB_ENVIRONMENT: demo
          CONFIRM_APPLY: "YES"
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          BACKEND_BUCKET_NAME: ${{ vars.TF_BACKEND_BUCKET }}
          BACKEND_CONFIG: ${{ github.workspace }}/artifacts/deploy/activation-transfer/backend.hcl
          TFVARS_FILE: ${{ github.workspace }}/artifacts/deploy/activation-transfer/demo-ci.tfvars.json
          PLAN_STAGE: activation
          DEPLOYMENT_GOVERNANCE_MODE: ${{ inputs.governance_mode }}
          PLAN_FILE: ${{ github.workspace }}/artifacts/deploy/activation-transfer/activation.tfplan
          PLAN_MANIFEST: ${{ github.workspace }}/artifacts/deploy/activation-transfer/activation.tfplan.identity.json
        run: ./scripts/ci_apply_saved_plan.sh
      - name: Preserve only the sealed activation identity in the encrypted audit bucket
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          audit_bucket="modelguard-ai-demo-${AWS_ACCOUNT_ID}-${AWS_REGION}-audit"
          aws s3api put-object \
            --bucket "$audit_bucket" \
            --key "deployments/plan-identities/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/activation.json" \
            --body artifacts/deploy/activation-transfer/activation.tfplan.identity.json \
            --expected-bucket-owner "$AWS_ACCOUNT_ID" >/dev/null
      - name: Delete the exact private activation transfer after successful apply
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
          BACKEND_KMS_KEY_ARN: ${{ vars.TF_BACKEND_KMS_KEY_ARN }}
          PLAN_STAGE: activation
          TRANSFER_DIRECTORY: artifacts/deploy/activation-transfer
        run: ./scripts/confidential_plan_transfer.sh delete

  post-deploy-smoke:
    name: Restricted-network live, ready, version, and prediction smoke
    needs: [prerequisite-plan, resolve-images, activation-apply]
    runs-on: [self-hosted, linux, x64, modelguard-demo]
    timeout-minutes: 30
    environment: demo
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      runtime_smoke_passed: ${{ steps.smoke_result.outputs.passed }}
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      GOVERNANCE_MODE: ${{ inputs.governance_mode }}
      API_ACCESS_MODE: ${{ vars.DEMO_API_ACCESS_MODE }}
      SMOKE_BASE_URL: ${{ vars.DEMO_SMOKE_BASE_URL }}
      EXPECTED_MODEL_VERSION: ${{ inputs.model_version }}
      EXPECTED_MODEL_MANIFEST_SHA256: ${{ inputs.model_manifest_sha256 }}
      EVIDENCE_DIR: artifacts/deploy/smoke
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Download the published release evidence
        if: ${{ inputs.governance_mode == 'team_protected' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: >-
            published-image-manifest-${{ inputs.source_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/deploy/record-inputs/published
      - name: Download the verified model pointer
        if: ${{ inputs.governance_mode == 'team_protected' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-activation-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/deploy/record-inputs/verified
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.12.1
          python-version: "3.12"
          enable-cache: true
      - name: Synchronize the locked environment
        run: uv sync --all-groups --locked
      - name: Assume the protected-environment deploy role through OIDC
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: modelguard-smoke-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
      - name: Retrieve private deployment identities from encrypted audit storage
        run: |
          root=artifacts/deploy/record-inputs
          mkdir -p "$root/prerequisite" "$root/activation" "$root/published" "$root/verified"
          audit_bucket="modelguard-ai-demo-${AWS_ACCOUNT_ID}-${AWS_REGION}-audit"
          identity_prefix="deployments/plan-identities/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
          aws s3api get-object --bucket "$audit_bucket" \
            --key "${identity_prefix}/prerequisites.json" \
            --expected-bucket-owner "$AWS_ACCOUNT_ID" \
            "$root/prerequisite/prerequisites.tfplan.identity.json" >/dev/null
          aws s3api get-object --bucket "$audit_bucket" \
            --key "${identity_prefix}/activation.json" \
            --expected-bucket-owner "$AWS_ACCOUNT_ID" \
            "$root/activation/activation.tfplan.identity.json" >/dev/null
          if [[ "${{ inputs.governance_mode }}" = "solo_portfolio" ]]; then
            aws s3api get-object --bucket "$audit_bucket" \
              --key "release-manifests/${{ inputs.source_commit }}.json" \
              --expected-bucket-owner "$AWS_ACCOUNT_ID" \
              "$root/published/image-release-manifest.json" >/dev/null
            aws s3api get-object --bucket "$audit_bucket" \
              --key "deployments/activation-inputs/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/active-pointer.json" \
              --expected-bucket-owner "$AWS_ACCOUNT_ID" \
              "$root/verified/active-pointer.json" >/dev/null
          fi
      - name: Wait for ECS deployment stability
        run: >-
          aws ecs wait services-stable
          --cluster modelguard-ai-demo
          --services modelguard-ai-demo-api modelguard-ai-demo-dashboard
      - name: Validate the smoke access mode
        run: >-
          [[ "$API_ACCESS_MODE" == "https_token" ||
          "$API_ACCESS_MODE" == "http_cidr_only" ]]
      - name: Run HTTPS live, ready, version, and prediction smoke checks
        if: ${{ env.API_ACCESS_MODE == 'https_token' }}
        env:
          PREDICTION_BEARER_TOKEN: ${{ secrets.DEMO_PREDICTION_BEARER_TOKEN }}
        run: ./scripts/smoke_aws.sh
      - name: Run CIDR-only live, ready, version, and prediction smoke checks
        if: ${{ env.API_ACCESS_MODE == 'http_cidr_only' }}
        run: ./scripts/smoke_aws.sh
      - name: Capture exact deployed task definitions
        run: |
          api_task="$(aws ecs describe-services \
            --cluster modelguard-ai-demo --services modelguard-ai-demo-api \
            --query 'services[0].taskDefinition' --output text)"
          dashboard_task="$(aws ecs describe-services \
            --cluster modelguard-ai-demo --services modelguard-ai-demo-dashboard \
            --query 'services[0].taskDefinition' --output text)"
          monitor_task="$(aws scheduler get-schedule \
            --group-name modelguard-ai-demo-monitor --name modelguard-ai-demo-monitor \
            --query 'Target.EcsParameters.TaskDefinitionArn' --output text)"
          api_image="$(aws ecs describe-task-definition --task-definition "$api_task" \
            --query "taskDefinition.containerDefinitions[?name==\`api\`].image | [0]" --output text)"
          dashboard_image="$(aws ecs describe-task-definition --task-definition "$dashboard_task" \
            --query "taskDefinition.containerDefinitions[?name==\`dashboard\`].image | [0]" --output text)"
          monitor_image="$(aws ecs describe-task-definition --task-definition "$monitor_task" \
            --query "taskDefinition.containerDefinitions[?name==\`monitor\`].image | [0]" --output text)"
          # security-suppression:
          # finding=SC2016
          # justification=The jq filter uses only explicitly bound variables.
          # owner=modelguard-maintainers
          # expires=2026-10-31
          # shellcheck disable=SC2016
          jq -n \
            --arg api "$api_task" \
            --arg dashboard "$dashboard_task" \
            --arg monitor "$monitor_task" \
            '{api:$api,dashboard:$dashboard,monitor:$monitor}' \
            >artifacts/deploy/smoke/task-definitions.json
          # security-suppression:
          # finding=SC2016
          # justification=The jq filter uses only explicitly bound variables.
          # owner=modelguard-maintainers
          # expires=2026-10-31
          # shellcheck disable=SC2016
          jq -n \
            --arg api "$api_image" \
            --arg dashboard "$dashboard_image" \
            --arg monitor "$monitor_image" \
            '{api:$api,dashboard:$dashboard,monitor:$monitor}' \
            >artifacts/deploy/smoke/deployed-images.json
          aws ssm get-parameter \
            --name /modelguard-ai/demo/models/active \
            >artifacts/deploy/smoke/live-pointer-response.json
      - name: Create the candidate independent ECS and model rollback record
        run: |
          inputs_root="artifacts/deploy/record-inputs"
          uv run --frozen --no-sync python -m scripts.deployment_record create \
            --image-manifest "$inputs_root/published/image-release-manifest.json" \
            --pointer "$inputs_root/verified/active-pointer.json" \
            --live-pointer-response artifacts/deploy/smoke/live-pointer-response.json \
            --task-definitions artifacts/deploy/smoke/task-definitions.json \
            --deployed-images artifacts/deploy/smoke/deployed-images.json \
            --prerequisite-manifest "$inputs_root/prerequisite/prerequisites.tfplan.identity.json" \
            --activation-manifest "$inputs_root/activation/activation.tfplan.identity.json" \
            --smoke-summary artifacts/deploy/smoke/summary.json \
            --github-repository "$GITHUB_REPOSITORY" \
            --github-run-id "$GITHUB_RUN_ID" \
            --github-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --governance-mode "$GOVERNANCE_MODE" \
            --output artifacts/deploy/smoke/last-known-good.json
          rm -f artifacts/deploy/smoke/live-pointer-response.json
      - name: Mark the verified runtime result before evidence storage
        id: smoke_result
        run: echo "passed=true" >>"$GITHUB_OUTPUT"
      - name: Upload deployment, smoke, and candidate-record evidence
        if: ${{ always() && inputs.governance_mode == 'team_protected' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/deploy/smoke/
          if-no-files-found: warn
          retention-days: 30
      - name: Promote the durable record only after all evidence operations pass
        if: ${{ success() }}
        run: |
          audit_bucket="modelguard-ai-demo-${AWS_ACCOUNT_ID}-${AWS_REGION}-audit"
          history_key="deployments/history/${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          aws s3api put-object --bucket "$audit_bucket" --key "$history_key" \
            --body artifacts/deploy/smoke/last-known-good.json >/dev/null
          aws s3api put-object --bucket "$audit_bucket" \
            --key deployments/last-known-good.json \
            --body artifacts/deploy/smoke/last-known-good.json >/dev/null

  rollback-on-failure:
    name: Explicit ECS rollback; model pointer remains separate
    if: >-
      always() &&
      inputs.governance_mode == 'team_protected' &&
      (needs.activation-apply.result == 'failure' ||
       needs.activation-apply.result == 'cancelled' ||
       (needs.activation-apply.result == 'success' &&
        needs.post-deploy-smoke.outputs.runtime_smoke_passed != 'true'))
    needs: [activation-apply, post-deploy-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: demo
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.12.1
          python-version: "3.12"
      - name: Synchronize the locked environment
        run: uv sync --all-groups --locked
      - name: Assume the protected-environment deploy role through OIDC
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: modelguard-rollback-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
      - name: Load and validate the durable last-known-good record
        id: rollback
        run: |
          mkdir -p artifacts/deploy/rollback
          audit_bucket="modelguard-ai-demo-${AWS_ACCOUNT_ID}-${AWS_REGION}-audit"
          aws s3api get-object --bucket "$audit_bucket" \
            --key deployments/last-known-good.json \
            artifacts/deploy/rollback/last-known-good.json >/dev/null
          test "$(jq -r .deployment_governance_mode artifacts/deploy/rollback/last-known-good.json)" = \
            "team_protected"
          uv run --frozen --no-sync python -m scripts.deployment_record rollback-outputs \
            --record artifacts/deploy/rollback/last-known-good.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Roll API, dashboard, and scheduled monitor task identities back
        env:
          API_TASK_DEFINITION: ${{ steps.rollback.outputs.api_task_definition }}
          DASHBOARD_TASK_DEFINITION: ${{ steps.rollback.outputs.dashboard_task_definition }}
          MONITOR_TASK_DEFINITION: ${{ steps.rollback.outputs.monitor_task_definition }}
        run: |
          aws ecs update-service \
            --cluster modelguard-ai-demo \
            --service modelguard-ai-demo-api \
            --task-definition "$API_TASK_DEFINITION" \
            --desired-count 1 \
            --force-new-deployment >/dev/null
          aws ecs update-service \
            --cluster modelguard-ai-demo \
            --service modelguard-ai-demo-dashboard \
            --task-definition "$DASHBOARD_TASK_DEFINITION" \
            --desired-count 1 \
            --force-new-deployment >/dev/null
          aws scheduler get-schedule \
            --group-name modelguard-ai-demo-monitor \
            --name modelguard-ai-demo-monitor \
            >artifacts/deploy/rollback/schedule-before.json
          # security-suppression:
          # finding=SC2016
          # justification=The jq filter uses only the explicitly bound task identity.
          # owner=modelguard-maintainers
          # expires=2026-10-31
          # shellcheck disable=SC2016
          jq --arg task "$MONITOR_TASK_DEFINITION" \
            'del(.Arn,.CreationDate,.LastModificationDate) |
             .Target.EcsParameters.TaskDefinitionArn=$task | .State="ENABLED"' \
            artifacts/deploy/rollback/schedule-before.json \
            >artifacts/deploy/rollback/schedule-rollback.json
          aws scheduler update-schedule \
            --cli-input-json file://artifacts/deploy/rollback/schedule-rollback.json >/dev/null
          aws ecs wait services-stable \
            --cluster modelguard-ai-demo \
            --services modelguard-ai-demo-api modelguard-ai-demo-dashboard
          # security-suppression:
          # finding=SC2016
          # justification=The jq filter uses only explicitly bound variables.
          # owner=modelguard-maintainers
          # expires=2026-10-31
          # shellcheck disable=SC2016
          jq -n \
            --arg api "$API_TASK_DEFINITION" \
            --arg dashboard "$DASHBOARD_TASK_DEFINITION" \
            --arg monitor "$MONITOR_TASK_DEFINITION" \
            '{
              status:"ecs_rollback_completed",
              task_definitions:{api:$api,dashboard:$dashboard,monitor:$monitor},
              model_pointer_action:"none_separate_protected_operation",
              drift_triggered:false
            }' \
            >artifacts/deploy/rollback/summary.json
      - name: Upload rollback evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rollback-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/deploy/rollback/summary.json
            artifacts/deploy/rollback/schedule-rollback.json
          if-no-files-found: warn
          retention-days: 30
