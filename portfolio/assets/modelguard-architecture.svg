<title id="title">ModelGuard AI temporary AWS demo architecture</title>
<desc id="desc">A synthetic demo client reaches restricted ECS API and dashboard services. Prediction events flow through Firehose to S3, a scheduled monitor writes reports and alerts, and GitHub OIDC plus ECR and Terraform control delivery.</desc>
